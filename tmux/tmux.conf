# Enable mouse support (just in case you ever need it)
set -g mouse on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g mode-keys vi

# Commented out to prevent overriding the new theme
# source-file ~/.local/share/nvim/lazy/tokyonight.nvim/extras/tmux/tokyonight_day.tmux

set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Options
set -g renumber-windows on

# Pane separator
set -g pane-border-lines simple

# ==========================================
# Gruvbox Dark Tmux Theme
# ==========================================

# Main status bar background and text color (Dark charcoal and cream)
set -g status-style "bg=#282828,fg=#ebdbb2"

# Inactive window tabs (Slightly lighter grey background, muted text)
set -g window-status-style "bg=#3c3836,fg=#a89984"
set -g window-status-format " #I:#W "

# Active window tab (Gruvbox yellow background, dark crust text for contrast)
set -g window-status-current-style "bg=#d79921,fg=#282828,bold"
set -g window-status-current-format " #I:#W "

# Right status bar (Date/Time in grey, Custom text block in Gruvbox yellow)
set -g status-right "#[bg=#3c3836,fg=#ebdbb2] %Y-%m-%d < %I:%M %p #[bg=#d79921,fg=#282828,bold] AumNamahShivaya "

# Style the pane borders to match the aesthetic
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#d79921"
# Style the command prompt / message line
set -g message-style "bg=#3c3836,fg=#d79921,bold"
# ==========================================
# Initialize TMUX plugin manager
# (WARNING: This MUST remain at the very bottom of tmux.conf)
# ==========================================
run '~/.tmux/plugins/tpm/tpm'
